name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Lint (includes the Backend/Frontend import wall)
        run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests
        run: pnpm --filter ./contracts --filter ./backend/functions run test
      - name: Build backend
        run: pnpm build:backend
      - name: Build frontend + scan bundles for backend code and secrets
        run: pnpm build:frontend
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - name: Security rules tests (emulator)
        run: pnpm test:rules
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
