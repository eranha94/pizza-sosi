name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Lint (includes the Backend/Frontend import wall)
        run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests
        run: pnpm --filter ./contracts --filter ./backend/functions run test
      - name: Build backend
        run: pnpm build:backend
      - name: Build frontend + scan bundles for backend code and secrets
        run: pnpm build:frontend
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Security rules tests (emulator)
        run: pnpm test:rules
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  e2e:
    # The whole customer journey in a real browser against the real backend (Firebase emulators).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: pnpm install --frozen-lockfile
      - name: Build web (pointed at the emulators) + functions
        run: pnpm build:e2e
        env:
          VITE_PUBLIC_USE_EMULATORS: 'true'
          VITE_PUBLIC_FIREBASE_PROJECT_ID: demo-pizza-sosi
          VITE_PUBLIC_FIREBASE_API_KEY: demo-api-key
          VITE_PUBLIC_FIREBASE_AUTH_DOMAIN: localhost
          VITE_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-pizza-sosi.appspot.com
          VITE_PUBLIC_FIREBASE_APP_ID: '1:1:web:1'
      - run: pnpm --filter ./tests/e2e exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: tests/e2e/screens
          retention-days: 14

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
